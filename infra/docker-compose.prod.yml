# Production compose for the VPS (2 vCPU / 7.8GB RAM Hostinger KVM2, confirmed via
# the MCP connector - same box already running Caddy + the VPS MCP server on :8831).
#
# Security: only `api` and `web` are reachable from outside the docker network, and
# only through Caddy (see Caddyfile.snippet below) - Postgres/Redis/Kafka/MinIO have
# NO published host ports, same principle as the existing MCP server (bind internal,
# let Caddy be the only public door). Memory limits are sized to leave real headroom
# on a box with no swap configured yet (see README section "VPS: apa yang diperlukan").
#
# api/worker/web run from pre-built images (ruang-api/ruang-worker/ruang-web),
# NOT from `build:` against the repo. The images are produced by
# infra/build-and-deploy.sh, which: clones the repo into a throwaway temp dir,
# installs deps, runs `pnpm build` + `pnpm deploy --prod` (api/worker) or
# `next build` with output:"standalone" (web) to get dist-only artifacts,
# `docker build`s each artifact dir with infra/docker-runtime/*.Dockerfile,
# then deletes the temp clone. No source or devDependencies ever end up in
# an image layer, and no repository checkout persists on this VPS afterwards.
name: ruang-vraxen

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: platform
    secrets: [postgres_password]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    mem_limit: 512m
    networks: [internal]
    ports: ["127.0.0.1:5432:5432"] # loopback-only, same risk profile as api/web below - needed to run `prisma migrate` from the host

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 128m
    networks: [internal]

  kafka:
    # bitnami/kafka has no pullable tags left on Docker Hub anymore (Bitnami moved
    # most image tags behind their paid "Secure Images" program) - switched to the
    # official Apache Kafka image, which ships its own KRaft-mode entrypoint.
    image: apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # JVM default heap would be 1/4 of container-visible host RAM (~2GB) - far too
      # much for this box once Postgres/Node processes are also running. Pin it down.
      # (KAFKA_HEAP_OPTS is honored by the standard kafka-server-start.sh launcher,
      # not a Bitnami-specific var, so this still applies to the new image.)
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    volumes: ["kafkadata:/var/lib/kafka/data"]
    mem_limit: 768m
    networks: [internal]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: platform
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_password
    secrets: [minio_password]
    volumes: ["miniodata:/data"]
    mem_limit: 256m
    networks: [internal]
    # Console (:9001) intentionally not published - reach it via `ssh -L 9001:127.0.0.1:9001 vraxen`
    # when needed, same pattern already used for other admin UIs on this box.

  api:
    image: ruang-api:latest
    restart: unless-stopped
    env_file: .env.prod
    depends_on: [postgres, redis, kafka]
    mem_limit: 384m
    networks: [internal]
    ports: ["127.0.0.1:4000:4000"] # Caddy proxies to this; not reachable from outside the box directly

  worker:
    image: ruang-worker:latest
    restart: unless-stopped
    env_file: .env.prod
    depends_on: [postgres, kafka, api]
    mem_limit: 256m
    networks: [internal]
    # Run with `docker compose -f docker-compose.prod.yml up -d --scale worker=2` -
    # `replicas:` needs Swarm mode, plain `docker compose` doesn't support it. Each
    # replica joins the same Kafka consumer group, so they split task.assigned
    # events automatically; raise the count once real task volume is known.

  web:
    image: ruang-web:latest
    restart: unless-stopped
    environment:
      API_URL: http://api:4000
    depends_on: [api]
    mem_limit: 384m
    networks: [internal]
    ports: ["127.0.0.1:3000:3000"] # Caddy proxies to this

networks:
  internal:

volumes:
  pgdata:
  kafkadata:
  miniodata:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  minio_password:
    file: ./secrets/minio_password.txt
